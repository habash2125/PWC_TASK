name: lens

x-api-env: &api-env
  env_file: .env
  environment:
    APP_DB_HOST: app-db
    ANALYTICS_SQLITE_PATH: /app/data/analytics/northwind.db
    REDIS_URL: redis://cache:6379/0
  volumes:
    # the analytics SQLite file: written once by `migrate`, opened read-only by `api`
    - analytics-data:/app/data

services:
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-lens_app}
      POSTGRES_USER: ${APP_DB_USER:-lens_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-lens_app_dev_pw}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-lens_app} -d ${APP_DB_NAME:-lens_app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs the Alembic chain, the app seed and builds the analytics SQLite file, then exits 0.
  # `api` waits for this to complete successfully — the API never migrates itself.
  migrate:
    build:
      context: ./backend
    <<: *api-env
    command: ["python", "-m", "app.db.seed.run_all"]
    depends_on:
      app-db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    <<: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  app-db-data:
  analytics-data:
