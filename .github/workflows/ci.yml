name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend — lint, migrations, seeds, tests, golden set (hermetic), adversarial
    runs-on: ubuntu-latest
    services:
      app-db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: lens_app, POSTGRES_USER: lens_app, POSTGRES_PASSWORD: lens_app_dev_pw }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U lens_app" --health-interval 5s --health-timeout 3s --health-retries 20
      analytics-db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: lens_analytics, POSTGRES_USER: lens_analytics_owner, POSTGRES_PASSWORD: lens_analytics_owner_dev_pw }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U lens_analytics_owner" --health-interval 5s --health-timeout 3s --health-retries 20
      cache:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      APP_DB_HOST: localhost
      APP_DB_PORT: "5433"
      ANALYTICS_DB_HOST: localhost
      ANALYTICS_DB_PORT: "5434"
      REDIS_URL: redis://localhost:6380/0
      APP_ENV: test
      GUARD_ENFORCER: parser
      LLM_API_KEY: ""
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: lint
        run: ruff check app tests
      - name: migrations up → down → up
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: seeds (twice — idempotent)
        run: |
          python -m app.seed && python -m app.seed
          python -m app.db.seed.analytics_seed
      - name: tests (unit, functional, adversarial, hermetic golden set)
        run: pytest -q
      # The live half of the golden set needs a provider key; it runs on main only, as an informational job.
      - name: live golden set
        if: github.ref == 'refs/heads/main' && env.LIVE_LLM_API_KEY != ''
        env:
          LENS_LIVE_EVAL: "1"
          GUARD_ENFORCER: llm
          LLM_API_KEY: ${{ secrets.LIVE_LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LIVE_LLM_BASE_URL }}
        run: pytest -q tests/eval/test_golden.py -k live -s

  frontend:
    name: frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  compose:
    name: docker compose up --build reaches healthy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: curl -fsS http://localhost:8000/api/v1/health/ready | tee /dev/stderr | grep -q '"app_db":true'
      - run: curl -fsS -o /dev/null http://localhost:3000/
      - if: always()
        run: docker compose logs --no-color api migrate | tail -100
